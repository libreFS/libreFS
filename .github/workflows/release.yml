name: Release

# Triggers when a tag matching RELEASE.* is pushed.
# Example: git tag RELEASE.2026-04-12T20-58-35Z && git push origin RELEASE.2026-04-12T20-58-35Z
on:
  push:
    tags:
      - 'RELEASE.*'

permissions:
  contents: write   # needed to create GitHub Release and upload assets
  packages: write   # needed to push to GHCR

jobs:
  # ── Job 1: build binaries for every platform ─────────────────────────────
  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let other platforms finish even if one fails
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_suffix: ''
          - goos: linux
            goarch: arm64
            asset_suffix: ''
          - goos: darwin
            goarch: amd64
            asset_suffix: ''
          - goos: darwin
            goarch: arm64
            asset_suffix: ''
          - goos: windows
            goarch: amd64
            asset_suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build binary
        env:
          MINIO_RELEASE: RELEASE
        run: |
          # gen-ldflags.go must run for the HOST arch (amd64), not the cross-compile
          # target. Clearing GOOS/GOARCH for that one call prevents "exec format error"
          # when building for arm64/darwin/windows on an amd64 runner.
          LDFLAGS=$(GOOS= GOARCH= go run buildscripts/gen-ldflags.go)
          BINARY=librefs-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.asset_suffix }}
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -tags kqueue -trimpath --ldflags "$LDFLAGS" -o "$BINARY" .
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Generate SHA256 checksum
        run: sha256sum "$BINARY" > "${BINARY}.sha256sum"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            librefs-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.asset_suffix }}
            librefs-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.asset_suffix }}.sha256sum
          retention-days: 1

  # ── Job 2: build and push Docker image to GHCR ───────────────────────────
  docker:
    name: Docker image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/librefs/librefs
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: create GitHub Release and attach all binaries ─────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries   # wait for all binaries to be built

    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: List release assets
        run: ls -lh librefs-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            librefs-linux-amd64
            librefs-linux-amd64.sha256sum
            librefs-linux-arm64
            librefs-linux-arm64.sha256sum
            librefs-darwin-amd64
            librefs-darwin-amd64.sha256sum
            librefs-darwin-arm64
            librefs-darwin-arm64.sha256sum
            librefs-windows-amd64.exe
            librefs-windows-amd64.exe.sha256sum
